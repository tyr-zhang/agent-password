name: Bug report
description: Report a reproducible problem with agent-pwd
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve agent-pwd.

        **Please do not report security vulnerabilities in a public issue.** Use
        [GitHub Security Advisories](https://github.com/tyr-zhang/agent-password/security/advisories/new)
        instead; see [SECURITY.md](https://github.com/tyr-zhang/agent-password/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        Include the exact commands, the exit code, and any JSON output.
        Redact all secrets before submitting.
      placeholder: |
        1. bin/agent-pwd init
        2. bin/agent-pwd ...
        3. Observed exit code: ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Platform where the problem was observed.
      options:
        - macOS
        - Linux
        - Windows
      multiple: false
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agent-pwd version
      description: Output of `bin/agent-pwd version`, or the release tag you installed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and diagnostics
      description: |
        Paste relevant output from `bin/agent-pwd doctor` or `bin/agent-pwd audit verify`.
        Never include vault contents, master passwords, credentials, confirmation tokens, or fill handles.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: I removed all secrets and sensitive data from the output above.
          required: true
