name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      VERSION: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package binaries
        run: |
          set -euo pipefail
          COMMIT="${SHA:0:7}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w"
          LDFLAGS="$LDFLAGS -X github.com/tyr-zhang/agent-password/internal/build.Version=${VERSION}"
          LDFLAGS="$LDFLAGS -X github.com/tyr-zhang/agent-password/internal/build.Commit=${COMMIT}"
          LDFLAGS="$LDFLAGS -X github.com/tyr-zhang/agent-password/internal/build.Date=${DATE}"
          mkdir -p dist
          # Touch ID helper binaries are already embedded in internal/platform/assets;
          # no Swift build step is needed.
          for target in darwin:arm64 darwin:amd64 linux:amd64 windows:amd64; do
            goos="${target%%:*}"
            goarch="${target##*:}"
            binary="agent-pwd"
            if [ "$goos" = "windows" ]; then binary="agent-pwd.exe"; fi
            stage="dist/stage-${goos}-${goarch}"
            mkdir -p "$stage"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "$LDFLAGS" -o "$stage/$binary" ./cmd/agent-pwd
            archive="agent-pwd_${VERSION}_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then
              (cd "$stage" && zip -q "../${archive}.zip" "$binary")
            else
              tar -czf "dist/${archive}.tar.gz" -C "$stage" "$binary"
            fi
            rm -rf "$stage"
          done
          ls -l dist

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum agent-pwd_*.tar.gz agent-pwd_*.zip > checksums.txt
          cat checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: agent-pwd ${{ github.ref_name }}
          body: |
            agent-pwd `${{ github.ref_name }}` (commit `${{ github.sha }}`).

            - CGO-free binaries for macOS (arm64, amd64), Linux (amd64), and Windows (amd64).
            - Verify downloads with `sha256sum -c checksums.txt` (or `shasum -a 256 -c checksums.txt` on macOS).
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
